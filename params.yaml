# Every setting the pipeline uses. DVC re-runs only the stages whose params changed.
month: "2026-07"                    # Lichess month to ingest (the runner can move this to the next month)
model_name: chess-rating            # name in the MLflow model registry

bands: [800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400]   # rating band edges for sampling and reports

ingest:
  source: https://database.lichess.org/standard/lichess_db_standard_rated_{month}.pgn.zst
  games_per_band: 200              # stratified sample: up to this many games per band (by average rating)
  max_games_read: 20000000          # stop reading the month after this many games

validate:
  workers: 8                        # Ray tasks run in parallel

featurize:
  workers: 10                       # Ray actors, each with its own Stockfish process (one CPU core each)
  depth: 10                         # Stockfish search depth per position
  hash_mb: 16
  max_plies: 120                    # analyse the first 60 moves of each side at most
  endgame_material: 13              # both sides at or below this non-pawn material -> endgame
  batch_size: 20                    # games per actor call
  ray_dashboard: true               # Ray dashboard on port 8265 while featurize runs

train:
  seed: 42
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 2000
  early_stopping_rounds: 100
  min_child_samples: 40

promote:
  margin: 5                         # challenger must beat the champion's MAE by this many points
  coverage_min: 0.75                # the low-high range should contain the true rating ~80% of the time
  coverage_max: 0.85
  smoke_games: 3
  smoke_timeout_s: 180
