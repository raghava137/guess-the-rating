# Serves the static web page and forwards API calls to the backend service.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ =404;
    }

    # The alert webhook is for Alertmanager inside Docker only: from outside, only GET is allowed.
    location = /api/v1/alerts {
        limit_except GET { deny all; }
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;          # Stockfish analysis can take a while under load
    }

    location = /healthz {
        proxy_pass http://backend:8000;
    }
}
